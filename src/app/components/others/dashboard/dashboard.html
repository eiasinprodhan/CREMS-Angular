<!-- First Row: Project, Building, Employee, Customer -->
<div class="row g-4">
  <!-- Projects Card -->
  <div class="col-lg-3 col-sm-6">
    <a routerLink="/listprojects">
      <div class="card card-border-shadow-primary h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-2">
            <div class="avatar me-4">
              <span class="avatar-initial rounded bg-label-primary">
                <i class="icon-base ti tabler-album icon-28px"></i>
              </span>
            </div>
            <ng-container *ngIf="projects as projectList">
              <h4 class="mb-0">{{ projectList.length }}</h4>
            </ng-container>
          </div>
          <p class="mb-1">Projects</p>
        </div>
      </div>
    </a>
  </div>

  <!-- Buildings Card -->
  <div class="col-lg-3 col-sm-6">
    <a routerLink="/listbuildings">
      <div class="card card-border-shadow-info h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-2">
            <div class="avatar me-4">
              <span class="avatar-initial rounded bg-label-info">
                <i class="icon-base ti tabler-buildings icon-28px"></i>
              </span>
            </div>
            <ng-container *ngIf="buildings as buildingList">
              <h4 class="mb-0">{{ buildingList.length }}</h4>
            </ng-container>
          </div>
          <p class="mb-1">Buildings</p>
        </div>
      </div>
    </a>
  </div>

  <!-- Employees Card -->
  <div class="col-lg-3 col-sm-6">
    <a routerLink="/listemployees">
      <div class="card card-border-shadow-warning h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-2">
            <div class="avatar me-4">
              <span class="avatar-initial rounded bg-label-warning">
                <i class="icon-base ti tabler-users-group icon-28px"></i>
              </span>
            </div>
            <ng-container *ngIf="employees as employeeList">
              <h4 class="mb-0">{{ employeeList.length }}</h4>
            </ng-container>
          </div>
          <p class="mb-1">Employees</p>
        </div>
      </div>
    </a>
  </div>

  <!-- Customers Card -->
  <div class="col-lg-3 col-sm-6">
    <a routerLink="/listcustomers">
      <div class="card card-border-shadow-danger h-100">
        <div class="card-body">
          <div class="d-flex align-items-center mb-2">
            <div class="avatar me-4">
              <span class="avatar-initial rounded bg-label-danger">
                <i class="icon-base ti tabler-user-heart icon-28px"></i>
              </span>
            </div>
            <ng-container *ngIf="customers as customerList">
              <h4 class="mb-0">{{ customerList.length }}</h4>
            </ng-container>
          </div>
          <p class="mb-1">Customers</p>
        </div>
      </div>
    </a>
  </div>
</div>

<!-- Second Row: Total Credit and Total Debit Side by Side -->
<div class="row g-4 mt-2">
  <!-- Total Credit Card (Half Width) -->
  <div class="col-lg-6 col-md-6 col-sm-12">
    <div class="card card-border-shadow-success h-100">
      <div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <div class="avatar me-4">
            <span class="avatar-initial rounded bg-label-success">
              <i class="fa-solid fa-arrow-up"></i>
            </span>
          </div>
          <h4 class="mb-0">{{ totalCredit | currency }}</h4>
        </div>
        <p class="mb-1">Total Credit</p>
      </div>
    </div>
  </div>

  <!-- Total Debit Card (Half Width) -->
  <div class="col-lg-6 col-md-6 col-sm-12">
    <div class="card card-border-shadow-danger h-100">
      <div class="card-body">
        <div class="d-flex align-items-center mb-2">
          <div class="avatar me-4">
            <span class="avatar-initial rounded bg-label-danger">
              <i class="fa-solid fa-arrow-down"></i>
            </span>
          </div>
          <h4 class="mb-0">{{ totalDebit | currency }}</h4>
        </div>
        <p class="mb-1">Total Debit</p>
      </div>
    </div>
  </div>
</div>
