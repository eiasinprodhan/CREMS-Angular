<div *ngIf="message" class="alert" [ngClass]="'alert-' + messageType" role="alert">
  {{ message }}
</div>

<div class="card">
  <div class="row card-header flex-column flex-md-row border-bottom mx-0 px-3">
    <div class="col-md-auto me-auto d-md-flex align-items-center">
      <h5 class="card-title mb-0 text-md-start text-center">Raw Material</h5>
    </div>
    <div class="col-md-auto d-flex justify-content-end align-items-center">
      <button type="button" class="btn btn-primary" onclick="history.back()">
        <i class="fa-solid fa-arrow-left mx-1"></i>Return
      </button>
    </div>
  </div>

  <div class="card-body">
    <form [formGroup]="rawMaterialForm" (ngSubmit)="submitStockOut()">
      <div class="row mt-4">
        <div class="col-md-6 mb-3">
          <label for="rawMaterial" class="form-label fw-bold">Raw Material Name</label>
          <select
            id="rawMaterial"
            class="form-select"
            [class.is-invalid]="rawMaterialForm.get('rawMaterial')?.touched && rawMaterialForm.get('rawMaterial')?.invalid"
            (change)="onItemSelect($event)"
          >
            <option value="" disabled selected>Select Raw Material</option>
            <option *ngFor="let rm of rawmaterials" [value]="rm.id">{{ rm.name }} (Available: {{ rm.quantity }})</option>
          </select>
          <div *ngIf="rawMaterialForm.get('rawMaterial')?.touched && rawMaterialForm.get('rawMaterial')?.invalid" class="invalid-feedback">
            Raw Material is required.
          </div>
        </div>

        <div class="col-md-6 mb-3">
          <label for="date" class="form-label fw-bold">Date</label>
          <input
            type="date"
            id="date"
            class="form-control"
            formControlName="date"
            [class.is-invalid]="rawMaterialForm.get('date')?.touched && rawMaterialForm.get('date')?.invalid"
          />
          <div *ngIf="rawMaterialForm.get('date')?.touched && rawMaterialForm.get('date')?.invalid" class="invalid-feedback">
            Date is required.
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label for="quantity" class="form-label fw-bold">Quantity</label>
          <div class="input-group">
            <input
              type="number"
              id="quantity"
              class="form-control"
              formControlName="quantity"
              [class.is-invalid]="rawMaterialForm.get('quantity')?.touched && rawMaterialForm.get('quantity')?.invalid"
            />
            <span class="input-group-text">{{ selectedRawMaterials?.unit || 'Unit' }}</span>
          </div>
          <div *ngIf="rawMaterialForm.get('quantity')?.touched && rawMaterialForm.get('quantity')?.invalid" class="invalid-feedback">
            Quantity must be greater than 0.
          </div>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" [disabled]="!stageLoaded">
        <i class="fa-solid fa-floppy-disk mx-1"></i>Submit Stock
      </button>
    </form>
  </div>
</div>

<div class="card mt-4" *ngIf="stockOutlist.length > 0">
  <div class="card-body table-responsive">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Raw Material Name</th>
          <th>Date</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let sl of stockOutlist">
          <td>{{ sl.id }}</td>
          <td>{{ sl.name }}</td>
          <td>{{ sl.date | date:'mediumDate' }}</td>
          <td>{{ sl.quantity }} {{ sl.unit }}</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
