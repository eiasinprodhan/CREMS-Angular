<!-- Unit Details Card -->
<div class="card shadow-lg border-0 rounded-4 overflow-hidden">

  <!-- Card Header -->
  <div class="row card-header flex-column flex-md-row border-bottom mx-0 px-3">
    <div class="col-md-auto me-auto d-md-flex align-items-center">
      <h5 class="card-title mb-0 text-md-start text-center">Unit Details</h5>
    </div>
    <div class="col-md-auto d-flex justify-content-end align-items-center">
      <button type="button" class="btn btn-primary" onclick="history.back()">
        <i class="fa-solid fa-arrow-left mx-1"></i>Return
      </button>
    </div>
  </div>

  <!-- Card Body -->
  <div class="card-body px-4 py-5">
    <div *ngIf="unit && unit.unitNumber; else loadingTemplate">

      <!-- Carousel -->
      <div id="unitPhotoCarouselWrapper" class="mx-auto mb-5" style="max-width: 500px;">
        <div id="unitPhotoCarousel" class="carousel slide rounded-3 shadow-sm" data-bs-ride="carousel">
          <div class="carousel-inner rounded-3 overflow-hidden">
            <div 
              *ngFor="let url of unit.photoUrls; let i = index" 
              class="carousel-item" 
              [ngClass]="{ active: i === 0 }">
              <img 
                [src]="'http://localhost:8080/images/units/' + url" 
                class="d-block w-100" 
                alt="{{ url }}" 
                style="max-height: 300px; object-fit: cover;" />
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#unitPhotoCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#unitPhotoCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>

      <!-- Unit Details -->
      <div class="row g-4">
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Unit ID</label>
          <div class="text-secondary">{{ unit.id }}</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Unit Number</label>
          <div class="text-secondary">{{ unit.unitNumber }}</div>
        </div>

        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Area (sqft)</label>
          <div class="text-secondary">{{ unit.area }}</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Bedrooms</label>
          <div class="text-secondary">{{ unit.bedrooms }}</div>
        </div>

        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Bathrooms</label>
          <div class="text-secondary">{{ unit.bathrooms }}</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Booking Status</label>
          <div>
            <span class="badge px-3 py-2 fs-6"
              [ngClass]="unit.booked ? 'bg-success' : 'bg-warning text-dark'">
              {{ unit.booked ? 'Booked' : 'Available' }}
            </span>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Floor</label>
          <div class="text-secondary">{{ floor.name || unit.floorId }}</div>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Building</label>
          <div>
            <a 
              routerLink="/viewbuildings/{{building.id}}" 
              class="text-decoration-none text-info fw-medium">
              {{ building.name || unit.buildingId }}
            </a>
          </div>
        </div>

        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Customer</label>
          <div class="text-secondary">
            <a routerLink="/viewcustomers/{{customer.id}}"> {{customer.name || 'N/A' }}</a>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading State -->
    <ng-template #loadingTemplate>
      <div class="text-center text-muted fst-italic pt-4">
        Loading unit data or no data available.
      </div>
    </ng-template>
  </div>
</div>
