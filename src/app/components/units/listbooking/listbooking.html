<div class="card">
  <div class="card-datatable table-responsive pt-0">
    <div class="dt-container dt-bootstrap5 dt-empty-footer">
      <div class="row card-header flex-column flex-md-row border-bottom mx-0 px-3">
        <div class="d-md-flex justify-content-between align-items-center dt-layout-start col-md-auto me-auto mt-0">
          <h5 class="card-title mb-0 text-md-start text-center pb-md-0 pb-6">Bookings</h5>
        </div>
      </div>

      <div class="justify-content-between dt-layout-table">
        <div class="d-md-flex justify-content-between align-items-center dt-layout-full table-responsive">
          <table class="datatables-basic table dataTable dtr-column">
            <thead>
              <tr>
                <th>ID</th>
                <th>Photo</th>
                <th>Customer Name</th>
                <th>Building Name</th>
                <th>Floor Name</th>
                <th>Due Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody>
              <tr *ngFor="let booking of enrichedBookings">
                <td>{{ booking.id }}</td> 
                <td><img [src]="booking.customer.photo" [alt]="booking.customer?.name" class="img-thumbnail" style="height: 50px; width: 50px; object-fit: cover;"/></td>
                <td>{{ booking.customer?.name }}</td>
                <td>{{ booking.building?.name }}</td>
                <td>{{ booking.floor?.name }}</td>
                <td class="text-danger">{{ booking.dueAmount | currency }}</td>
                <td>
                  <div class="d-flex gap-2">
                    <button class="btn btn-sm btn-outline-info" (click)="viewBooking(booking.id)">
                      <i class="fa fa-eye"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-primary" (click)="editBooking(booking.id)">
                      <i class="fa fa-edit"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger" (click)="deleteBooking(booking.id)">
                      <i class="fa fa-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
              <tr *ngIf="enrichedBookings.length === 0">
                <td colspan="8" class="text-center">No bookings found.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
