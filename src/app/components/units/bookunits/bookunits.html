<div class="card">
  <!-- Card Header -->
  <div
    class="row card-header flex-column flex-md-row align-items-center mx-0 px-3"
  >
    <div class="col-md-auto me-auto d-md-flex align-items-center">
      <h5 class="mb-0 text-md-start text-center">Book Unit</h5>
    </div>
    <div class="col-md-auto d-flex justify-content-end">
      <button type="button" class="btn btn-primary" (click)="goBack()">
        <i class="fa-solid fa-arrow-left me-2"></i>Return
      </button>
    </div>
  </div>

  <div class="card-body py-5 px-4 px-md-5">
    <!-- 📸 Building Photo -->
    <div class="mb-5">
      <label for="price" class="form-label">Building Photo</label>
      <div class="text-center">
        <img
          [src]="'http://localhost:8080/images/buildings/' + building.photo"
          alt="Building Photo"
          class="img-fluid rounded"
          style="max-height: 300px; object-fit: cover;"
        />
      </div>
    </div>

    <!-- 🏘️ Unit Photos Grid -->
    <div class="mb-5">
      <label for="price" class="form-label">Unit Photos</label>
      <div class="row g-2">
        <div
          class="col-6 col-md-4 col-lg-3"
          *ngFor="let url of unit.photoUrls; let i = index"
        >
          <img
            [src]="'http://localhost:8080/images/units/' + url"
            alt="Unit Photo"
            class="img-fluid rounded shadow-sm cursor-pointer"
            (click)="openLightbox(i)"
            style="height: 150px; width: 100%; object-fit: cover;"
          />
        </div>
      </div>
    </div>

    <!-- 💡 Lightbox Modal -->
    <div
      class="lightbox-overlay"
      *ngIf="lightboxVisible"
      (click)="closeLightbox()"
    >
      <div class="lightbox-content" (click)="$event.stopPropagation()">
        <button
          class="btn btn-light position-absolute top-0 end-0 m-3"
          (click)="closeLightbox()"
        >
          &times;
        </button>
        <img
          [src]="'http://localhost:8080/images/units/' + unit.photoUrls[lightboxIndex]"
          class="img-fluid d-block mx-auto"
          alt="Full Unit Image"
          style="max-height: 90vh;"
        />
        <div class="d-flex justify-content-between mt-3 px-4">
          <button
            class="btn btn-outline-light"
            (click)="prevLightbox($event)"
            [disabled]="lightboxIndex === 0"
          >
            Previous
          </button>
          <button
            class="btn btn-outline-light"
            (click)="nextLightbox($event)"
            [disabled]="lightboxIndex === unit.photoUrls.length - 1"
          >
            Next
          </button>
        </div>
      </div>
    </div>

    <!-- 📝 Form -->
    <form #unitForm="ngForm">
      <!-- Unit Details -->
      <div class="row g-4 mb-4">
        <div class="col-md-6">
          <label class="form-label">Unit Number</label>
          <p class="form-control-plaintext">{{ unit.unitNumber }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label">Area (sqft)</label>
          <p class="form-control-plaintext">{{ unit.area }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label">Bedrooms</label>
          <p class="form-control-plaintext">{{ unit.bedrooms }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label">Bathrooms</label>
          <p class="form-control-plaintext">{{ unit.bathrooms }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label">Floor</label>
          <p class="form-control-plaintext">{{ floor.name || unit.floorId }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label">Building</label>
          <p class="form-control-plaintext">
            <a routerLink="/viewbuildings/{{ building.id }}">
              {{ building.name || unit.buildingId }}
            </a>
          </p>
        </div>
      </div>

      <!-- Booking Status -->
      <div class="mb-4">
        <label class="form-label">Booking Status</label>
        <select
          class="form-select"
          name="booked"
          [(ngModel)]="unit.booked"
          required
        >
          <option [ngValue]="false">Available</option>
          <option [ngValue]="true">Booked</option>
        </select>
      </div>

      <!-- Customer -->
      <div class="mb-4">
        <label for="customerId" class="form-label">Customer</label>
        <select
          id="customerId"
          class="form-select"
          name="customerId"
          [(ngModel)]="unit.customerId"
          required
        >
          <option [ngValue]="null">-- No Customer --</option>
          <option *ngFor="let customer of customers" [ngValue]="customer.id">
            {{ customer.name }}
          </option>
        </select>
      </div>

      <!-- Price -->
      <div class="mb-5">
        <label for="price" class="form-label">Price</label>
        <input
          type="number"
          id="price"
          class="form-control"
          name="price"
          [(ngModel)]="unit.price"
          required
          min="0"
          step="0.01"
          placeholder="Enter price in USD"
        />
      </div>

      <!-- Submit Button -->
      <div class="d-flex justify-content-end">
        <button
          class="btn btn-primary"
          type="submit"
          [disabled]="!unitForm.form.valid"
          (click)="updateUnit()"
        >
          Book Unit
        </button>
      </div>
    </form>

    <!-- Message -->
    <div *ngIf="message" class="mt-4">
      <div
        [ngClass]="{
          'alert alert-success': messageType === 'success',
          'alert alert-danger': messageType === 'error'
        }"
        role="alert"
      >
        {{ message }}
      </div>
    </div>
  </div>
</div>
