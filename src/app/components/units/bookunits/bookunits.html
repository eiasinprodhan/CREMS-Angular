<!-- Book Unit Card -->
<div class="card shadow-lg border-0 rounded-4 overflow-hidden">

  <!-- Card Header -->
  <div
    class="row card-header flex-column flex-md-row align-items-center mx-0 px-3"
  >
    <div class="col-md-auto me-auto d-md-flex align-items-center">
      <h5 class="mb-0 text-md-start text-center">Book Unit</h5>
    </div>
    <div class="col-md-auto d-flex justify-content-end">
      <button type="button" class="btn btn-primary" onclick="history.back()">
        <i class="fa-solid fa-arrow-left me-2"></i>Return
      </button>
    </div>
  </div>

  <!-- Card Body -->
  <div class="card-body px-4 py-5">
    <form (ngSubmit)="updateUnit()" #unitForm="ngForm" novalidate>

      <!-- Carousel -->
      <div id="unitPhotoCarouselWrapper" class="mx-auto mb-5" style="max-width: 500px;">
        <div id="unitPhotoCarousel" class="carousel slide rounded-3 shadow-sm" data-bs-ride="carousel">
          <div class="carousel-inner rounded-3 overflow-hidden">
            <div 
              *ngFor="let url of unit.photoUrls; let i = index" 
              class="carousel-item" 
              [ngClass]="{ active: i === 0 }">
              <img 
                [src]="url" 
                class="d-block w-100" 
                alt="Unit Photo" 
                style="max-height: 300px; object-fit: cover;" />
            </div>
          </div>
          <button class="carousel-control-prev" type="button" data-bs-target="#unitPhotoCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">Previous</span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#unitPhotoCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon bg-dark rounded-circle p-2" aria-hidden="true"></span>
            <span class="visually-hidden">Next</span>
          </button>
        </div>
      </div>

      <!-- Unit Info Display -->
      <div class="row g-4 mb-4">
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Unit Number</label>
          <p class="form-control-plaintext text-muted">{{ unit.unitNumber }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Area (sqft)</label>
          <p class="form-control-plaintext text-muted">{{ unit.area }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Bedrooms</label>
          <p class="form-control-plaintext text-muted">{{ unit.bedrooms }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Bathrooms</label>
          <p class="form-control-plaintext text-muted">{{ unit.bathrooms }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Floor</label>
          <p class="form-control-plaintext text-muted">{{ floor.name || unit.floorId }}</p>
        </div>
        <div class="col-md-6">
          <label class="form-label text-primary fw-semibold">Building</label>
          <p class="form-control-plaintext">
            <a routerLink="/viewbuildings/{{building.id}}" class="text-decoration-none text-info fw-medium">
              {{ building.name || unit.buildingId }}
            </a>
          </p>
        </div>
      </div>

      <!-- Booking Status Dropdown -->
      <div class="mb-4">
        <label class="form-label fw-semibold text-primary">Booking Status</label>
        <select
          class="form-select shadow-sm"
          name="isBooked"
          [(ngModel)]="unit.isBooked"
          required>
          <option [ngValue]="false">Available</option>
          <option [ngValue]="true">Booked</option>
        </select>
      </div>

      <!-- Customer Selection -->
      <div class="mb-4">
        <label for="customerId" class="form-label fw-semibold text-primary">Customer</label>
        <select
          id="customerId"
          class="form-select shadow-sm"
          name="customerId"
          [(ngModel)]="unit.customerId"
          required>
          <option [ngValue]="null">-- No Customer --</option>
          <option *ngFor="let customer of customers" [ngValue]="customer.id">
            {{ customer.name }}
          </option>
        </select>
      </div>

      <!-- Price Input -->
      <div class="mb-5">
        <label for="price" class="form-label fw-semibold text-primary">Price</label>
        <input
          type="number"
          id="price"
          class="form-control shadow-sm"
          name="price"
          [(ngModel)]="unit.price"
          required
          min="0"
          step="0.01"
          placeholder="Enter price in USD" />
      </div>

      <!-- Submit Button -->
      <div class="d-flex justify-content-end">
        <button
          class="btn btn-gradient-primary px-4 py-2"
          type="submit"
          [disabled]="!unitForm.form.valid"
          (click)="printInvoice()">
          <i class="fa-solid fa-check me-2"></i>Book Unit
        </button>
      </div>
    </form>

    <!-- Alert Messages -->
    <div *ngIf="message" class="mt-4">
      <div
        [ngClass]="{
          'alert alert-success': messageType === 'success',
          'alert alert-danger': messageType === 'error'
        }"
        role="alert">
        {{ message }}
      </div>
    </div>
  </div>
</div>
